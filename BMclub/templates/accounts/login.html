{% extends "base.html" %}
{% block title %}Member Login — Blushing Moon{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card bg-body-tertiary border-secondary p-4 shadow">
            <h3 class="mb-3 text-center">Member Login</h3>
            <form method="post">
                {% csrf_token %}
                {% if form.non_field_errors %}
                    <div class="alert alert-danger small">{{ form.non_field_errors|striptags }}</div>
                {% endif %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-danger w-100">Sign In</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
